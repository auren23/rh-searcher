name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rh
          POSTGRES_PASSWORD: rh
          POSTGRES_DB: rh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          # 禁止旧的 checkpoint 策略名（命名空间化后旧名会破坏重启恢复）
          ! grep -R 'heights\["pools"\]' cmd/
          ! grep -R 'saveCheckpoint("blocks"' cmd/
          ! grep -R 'ckpt.Save("pools"' cmd/
          ! grep -R 'heights\["blocks"\]' cmd/
      - name: Test (unit)
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Create integration databases
        env:
          RH_TEST_PG_URL: postgres://rh:rh@localhost:5432/rh
        run: |
          psql "$RH_TEST_PG_URL" -c "DROP DATABASE IF EXISTS rh_runner WITH (FORCE)"
          psql "$RH_TEST_PG_URL" -c "DROP DATABASE IF EXISTS rh_sql_fresh WITH (FORCE)"
          psql "$RH_TEST_PG_URL" -c "DROP DATABASE IF EXISTS rh_sql_legacy WITH (FORCE)"
          psql "$RH_TEST_PG_URL" -c "CREATE DATABASE rh_runner"
          psql "$RH_TEST_PG_URL" -c "CREATE DATABASE rh_sql_fresh"
          psql "$RH_TEST_PG_URL" -c "CREATE DATABASE rh_sql_legacy"
      - name: Test fresh SQL migrations (compatibility only)
        env:
          RH_TEST_PG_URL: postgres://rh:rh@localhost:5432/rh_sql_fresh
        run: |
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0001_init.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0002_shadow_schema_fix.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0003_opportunity_grouping.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0004_group_selected_unique.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0005_reorg_checkpoint.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0006_reorg_history.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0007_seed_history.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0008_evaluation_cursor.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0009_provenance_source.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0010_gas_estimate_mode.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0011_gas_mode_truthful.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0012_schema_migrations.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0013_sanitize_legacy_historical.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0014_legacy_unverifiable.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0015_observation_modes.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0016_state_lag.sql
          psql "$RH_TEST_PG_URL" -c "\d opportunities" | grep -q route_json
          psql "$RH_TEST_PG_URL" -c "\d opportunities" | grep -q opportunity_group_id
          psql "$RH_TEST_PG_URL" -c "\d dex_pools" | grep -q tick_spacing
          psql "$RH_TEST_PG_URL" -c "\d dex_pools" | grep -q canonical
          psql "$RH_TEST_PG_URL" -c "\d strategy_checkpoints" | grep -q block_hash
      - name: Test legacy SQL migration (compatibility only)
        env:
          RH_TEST_PG_URL: postgres://rh:rh@localhost:5432/rh_sql_legacy
        run: |
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/testdata/schema_at_0001_legacy.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0002_shadow_schema_fix.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0003_opportunity_grouping.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0004_group_selected_unique.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0005_reorg_checkpoint.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0006_reorg_history.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0007_seed_history.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0008_evaluation_cursor.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0009_provenance_source.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0010_gas_estimate_mode.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0011_gas_mode_truthful.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0012_schema_migrations.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0013_sanitize_legacy_historical.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0014_legacy_unverifiable.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0015_observation_modes.sql
          psql "$RH_TEST_PG_URL" -v ON_ERROR_STOP=1 -f internal/storage/migrations/0016_state_lag.sql
          psql "$RH_TEST_PG_URL" -c "\d opportunities" | grep -q route_json
          psql "$RH_TEST_PG_URL" -c "SELECT 1 FROM information_schema.table_constraints WHERE constraint_name='execution_attempts_opportunity_id_fkey'" | grep -q 1

      - name: Test PostgreSQL integration (runner-managed database)
        env:
          RH_TEST_PG_URL: postgres://rh:rh@localhost:5432/rh
          RH_POSTGRES_URL: postgres://rh:rh@localhost:5432/rh_runner
        run: |
          # 集成库完全由迁移 runner 初始化（Fresh-safe 路径）
          go run ./cmd/rh-cli migrate
          go run ./cmd/rh-cli migrate  # 幂等二次执行
          EXPECTED=$(ls internal/storage/migrations/[0-9][0-9][0-9][0-9]_*.sql | wc -l)
          ACTUAL=$(psql "$RH_POSTGRES_URL" -tAc "SELECT COUNT(*) FROM schema_migrations")
          test "$ACTUAL" -eq "$EXPECTED"
          RH_TEST_PG_URL="$RH_POSTGRES_URL" go test ./internal/storage/ -count=1 -v
          RH_TEST_PG_URL="$RH_POSTGRES_URL" go test -race ./internal/storage/ -count=1

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Test contracts
        working-directory: contracts
        run: forge test -vvv
