# rh-searcher 链配置 —— M0 已核实（2026-08-05，见 deployments/M0-chain-facts.md）
# 敏感值（私钥/API Key）一律用环境变量注入，禁止写入本文件。

chain:
  id: 4663 # Robinhood Chain mainnet（官方文档 + eth_chainId 双重确认）
  weth: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73" # aeWETH（eip1967 proxy，实现 0xC6B81b429797E0f555440b70cD99e032D7AE947e，标准 ERC20+deposit/withdraw）
  # wbtc/usdc: Robinhood 未镜像 mainnet 地址；稳定币确认为 Morpho 市场 loan asset（见 morpho.yaml）
  gas_limit: 5000000

rpc:
  # 读取/发送/模拟严格分组。公共端点限速，仅开发用；生产用供应商端点。
  groups:
    archive: # 历史读取（M0: 公共 RPC 不支持 archive 方法，需供应商）
      - "${RH_ARCHIVE_RPC:-https://rpc.mainnet.chain.robinhood.com}"
    read: # 实时 WebSocket 读取（公共 WS 端点）
      - "${RH_READ_WS_RPC:-wss://rpc.mainnet.chain.robinhood.com/ws}"
    sim: # 独立模拟 RPC
      - "${RH_SIM_RPC:-https://rpc.mainnet.chain.robinhood.com}"
    send: # GMGN 快速 RPC（发送专用；M0 TODO: 确认 GMGN 是否支持 robinhood 链）
      - "${RH_GMGN_RPC}"
  timeout_sec: 10
  max_retries: 3

mode:
  run: "shadow" # dry | shadow | live —— live 前必须通过 M5 Canary 门槛

# 存储（本地开发用 docker-compose 的 postgres）
storage:
  postgres_url: "${RH_POSTGRES_URL:-postgres://rh:rh@localhost:5432/rh}"

# 执行合约与热钱包（模拟/发送用；M4 部署后填写，地址来自 deployments/）
executor:
  contract: "${RH_EXECUTOR_CONTRACT:-}"
  wallet: "${RH_HOT_WALLET:-}"

# 套利策略参数（资金限制：搜索上限 = min(池深度, max_input_wei, 合约余额)）
arbitrage:
  max_input_wei: "30000000000000000"  # 0.03 WETH 单笔上限
  min_input_wei: "10000000000000"     # 1e-5 WETH 单笔下限（浅池保护）
  min_profit_wei: "10000000000000"    # 1e-5 WETH
  safety_margin_wei: "5000000000000"  # 5e-6 WETH
  simulation_top_k: 5
  simulation_mode: local_only
  local_gas_units: 500000
  local_gas_stress_multiplier: 2
  max_observation_lag_blocks: 2
